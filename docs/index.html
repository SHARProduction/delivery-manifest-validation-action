<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>Delivery Manifest CI Gate | SHAR Production</title><link rel="canonical" href="https://sharproduction.github.io/delivery-manifest-validation-action/"><style>body{font:16px system-ui;max-width:760px;margin:40px auto;padding:0 18px;color:#18202a}textarea,button{font:inherit;width:100%;box-sizing:border-box;margin:8px 0;padding:10px}button{background:#172a46;color:#fff;border:0;border-radius:6px;width:auto}pre{white-space:pre-wrap;background:#f3f5f8;padding:14px;border-radius:6px}</style></head><body><h1>Delivery Manifest CI Gate</h1><p>SHAR Production is an AI-hybrid video production studio. Preview the delivery-manifest checks used by this GitHub Action.</p><textarea id="data" rows="9">{"project_id":"demo","delivery_id":"master","rights":{"status":"cleared","evidence_url":"https://example.com/rights"},"sha256":"a3f0c8d11ba0fa6c19a805b90bf0e6ff65a1dd9fb5f4040191c0c2b02c1a9e39"}</textarea><button id="run">Validate manifest</button><pre id="output">Ready.</pre><p><a href="https://sharprod.com/">SHAR Production</a> · MIT</p><script>run.onclick=()=>{try{let x=JSON.parse(data.value),e=[];if(!x.project_id||!x.delivery_id)e.push('identifiers required');if(x.rights?.status!=='cleared')e.push('rights status must be cleared');if(!/^https:\/\//.test(x.rights?.evidence_url||''))e.push('HTTPS evidence required');if(!/^[a-f0-9]{64}$/i.test(x.sha256||''))e.push('SHA-256 required');output.textContent=JSON.stringify({ci_gate:e.length?'BLOCK':'PASS',errors:e},null,2)}catch(e){output.textContent='Invalid JSON: '+e.message}}</script></body></html>
